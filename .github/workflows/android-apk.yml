name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.VITE_SUPABASE_URL || vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase configuration
        shell: bash
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Configure the Supabase URL and publishable key as repository secrets or variables before publishing the Android APK."
            exit 1
          fi

          if [[ "$VITE_SUPABASE_URL" != https://* ]]; then
            echo "::error::VITE_SUPABASE_URL must use HTTPS."
            exit 1
          fi

      - name: Build web assets
        run: npm run build

      - name: Verify Supabase configuration in web bundle
        shell: bash
        run: |
          if ! grep -R -F -q "$VITE_SUPABASE_URL" dist; then
            echo "::error::The Supabase URL was not embedded in the mobile web bundle."
            exit 1
          fi

          if ! grep -R -F -q "$VITE_SUPABASE_PUBLISHABLE_KEY" dist; then
            echo "::error::The Supabase publishable key was not embedded in the mobile web bundle."
            exit 1
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Prepare optional release signing
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maisctrl-upload.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/maisctrl-upload.keystore" >> "$GITHUB_ENV"

      - name: Build release candidate AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=0.1.${{ github.run_number }}

      - name: Upload release candidate AAB
        uses: actions/upload-artifact@v4
        with:
          name: maisctrl-android-release-candidate
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=0.1.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maisctrl-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk maisctrl.apk

      - name: Generate APK checksum
        run: sha256sum maisctrl.apk > maisctrl.apk.sha256

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MaisCtrl Android — versão de teste
          body: "APK de teste mais recente do MaisCtrl para Android. O arquivo maisctrl.apk.sha256 permite conferir a integridade do download."
          prerelease: true
          make_latest: false
          files: |
            maisctrl.apk
            maisctrl.apk.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
